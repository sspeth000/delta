<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Delta for iOS">
  <title>Delta for iOS</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Delta home">
        <span class="brand-mark" aria-hidden="true">Δ</span>
        <span>DELTA</span>
      </a>
      <span class="platform">iOS</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow"><span class="status-dot"></span> iOS RELEASE</div>
      <div class="app-icon" aria-hidden="true">Δ</div>
      <h1 id="page-title">Delta</h1>
      <p class="subtitle">A simple app demo for iOS.</p>
      <div class="version-row">
        <span>Version <strong>2.717.982</strong></span>
        <span class="separator" aria-hidden="true">•</span>
        <span>iPhone &amp; iPad</span>
      </div>
      <a class="install-button" id="install-link" href="#">
        <span>Install for iOS</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>
      <p class="hint" id="install-hint">Open this page in Safari on your iPhone or iPad.</p>
    </section>

    <section class="details" aria-label="Release details">
      <div class="detail">
        <span class="detail-label">Release</span>
        <span class="detail-value">2.717.982</span>
      </div>
      <div class="detail">
        <span class="detail-label">Package</span>
        <span class="detail-value">iOS IPA</span>
      </div>
      <div class="detail">
        <span class="detail-label">Distribution</span>
        <span class="detail-value">Signed build</span>
      </div>
    </section>

    <footer class="footer">
      <span>Delta · iOS</span>
      <a href="https://github.com/sspeth000/delta/releases/tag/iOS" target="_blank" rel="noreferrer">Release notes <span aria-hidden="true">↗</span></a>
    </footer>
  </main>
</body>
</html>
